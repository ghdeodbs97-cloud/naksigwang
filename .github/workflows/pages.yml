name: 사이트 배포

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [데이터 수집]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # PR/feature 코드에 배포용 설정을 전달하지 않는다.
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Actions 전용 배포 소스 확인
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [ "$pages_type" != "workflow" ]; then
            echo "::error::Settings > Pages > Source를 GitHub Actions로 설정하세요. main 직접 배포는 지도 설정 주입을 덮어씁니다."
            exit 1
          fi
      - name: 공개 산출물 생성 · 설정 누락 시 배포 차단
        env:
          NAVER_MAP_KEY_ID: ${{ secrets.NAVER_MAP_KEY_ID || vars.NAVER_MAP_KEY_ID }}
        run: python tools/build_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages에 공개
        id: deployment
        uses: actions/deploy-pages@v4
