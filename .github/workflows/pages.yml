name: 사이트 배포

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [데이터 수집]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # PR/feature 코드에 배포용 설정을 전달하지 않는다.
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 공개 산출물 생성 · 설정 누락 시 배포 차단
        env:
          NAVER_MAP_KEY_ID: ${{ secrets.NAVER_MAP_KEY_ID || vars.NAVER_MAP_KEY_ID }}
        run: python tools/build_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages에 공개
        id: deployment
        uses: actions/deploy-pages@v4
