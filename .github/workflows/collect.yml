name: 데이터 수집

on:
  schedule:
    - cron: '25 20 * * *'   # 매일 05:25 (한국 시각)
    - cron: '25 8 * * *'    # 매일 17:25 (한국 시각)
  workflow_dispatch:
    inputs:
      limit:
        description: '시험용: 원천마다 받을 개수 (0 = 전체)'
        default: '0'
      force_tide:
        description: '조석을 지금 다시 받기 (1 = 예). 평소에는 오전 실행 때만 받음'
        default: '0'

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests korean_lunar_calendar
      - name: 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          LIMIT: ${{ github.event.inputs.limit || '0' }}
          FORCE_TIDE: ${{ github.event.inputs.force_tide || '0' }}
        run: python collector/collect.py
      - name: 저장 (바뀐 자료만 커밋)
        run: |
          git config user.name "naksigwang-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M') KST"
          git pull --rebase origin main
          git push
