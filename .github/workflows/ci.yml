name: P0·P1·P2B·P2C 검증
on:
  pull_request:
permissions:
  contents: read
jobs:
  p0:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: pip install requests korean_lunar_calendar playwright
      - run: pip install -r tools/depth-data/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Python 문법 검사
        run: python -m py_compile collector/collect.py tests/test_collector_resilience.py tests/smoke.py tests/smoke_degradation.py tests/test_bite_confidence.py tests/depth_probe.py tests/test_depth_converter.py tests/test_depth_foundation.py tests/test_khoa_fetch.py tests/test_khoa_depth.py tests/test_khoa_coverage.py tests/test_khoa_coverage_browser.py tools/depth-data/convert.py tools/depth-data/merge.py tools/depth-data/audit_mof.py tools/depth-data/fetch_khoa.py tools/depth-data/convert_khoa.py tools/depth-data/compare_khoa.py tools/depth-data/plan_east_khoa.py tools/depth-data/fetch_khoa_batch.py tools/depth-data/publish_khoa_coverage.py tools/depth-data/audit_east_coverage.py build.py
      - name: 수집기 회귀
        run: python tests/test_collector_resilience.py
      - name: 초기 로딩 회귀
        run: node tests/boot_degradation.mjs
      - name: 빌드
        run: python build.py
      - name: 기본 브라우저 검사
        run: python tests/smoke.py
      - name: 자료 실패 브라우저 검사
        run: python tests/smoke_degradation.py
      - name: 입질 조건·자료 신뢰도 회귀
        run: python tests/test_bite_confidence.py
      - name: 수심 GIS 변환 회귀
        run: python tests/test_depth_converter.py
      - name: 수심 자료 기반 브라우저 회귀
        run: python tests/test_depth_foundation.py
      - name: KHOA 수집·변환 mock 회귀
        run: python tests/test_khoa_fetch.py
      - name: KHOA 지도·단면 출처 연결 mock 회귀
        run: python tests/test_khoa_depth.py
      - name: KHOA 연안 캐시·재개·병합 mock 회귀
        run: python tests/test_khoa_coverage.py
      - name: KHOA 지역 이동·퇴거·중복 요청·로딩 제한 mock 회귀
        run: python tests/test_khoa_coverage_browser.py
      - name: 운영 자료 비변경 확인
        run: git diff --exit-code -- data
